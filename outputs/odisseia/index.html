    .sidebar{display:none!important}.app{display:block;min-height:100vh;max-width:480px;margin:0 auto}.main{width:100%;max-width:480px;margin:0 auto}.topbar{height:68px;padding:0 16px}.content{max-width:none;padding:20px 14px 96px}.bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:4;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:69px;background:rgba(17,22,28,.98);border-top:1px solid var(--stroke);backdrop-filter:blur(20px)}.bottom-nav button{background:transparent;color:var(--muted);font-size:10px;display:grid;place-content:center;gap:3px}.bottom-nav button.active{color:var(--orange2)}.bottom-nav i{font-style:normal;font-size:18px}.table{min-width:0;table-layout:fixed}.table th,.table td{overflow-wrap:anywhere}.table-wrap{overflow-x:hidden}.auth-shell{min-height:100vh;max-width:480px;margin:0 auto;padding:24px 16px 32px;display:grid;align-content:center}.auth-card{background:linear-gradient(155deg,rgba(35,41,48,.96),rgba(21,26,31,.96));border:1px solid var(--stroke);border-radius:24px;padding:22px;box-shadow:0 28px 75px rgba(0,0,0,.32)}.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:30px}.auth-title{font-size:30px;line-height:1.05;letter-spacing:-.05em;margin:0 0 8px}.auth-copy{color:var(--muted);font-size:13px;margin:0 0 22px}.auth-switch{display:flex;gap:6px;padding:4px;background:#11161b;border:1px solid var(--stroke);border-radius:12px;margin:20px 0}.auth-switch button{flex:1;min-height:38px;border-radius:9px;background:transparent;color:var(--muted);font-size:12px;font-weight:750}.auth-switch button.active{color:#fff;background:var(--surface)}.auth-note{display:flex;gap:9px;align-items:flex-start;color:var(--muted);font-size:11px;margin-top:16px}.auth-note b{color:#d9dde4}.auth-card .btn{width:100%}.auth-footer{margin-top:20px;text-align:center;color:var(--muted);font-size:11px}

  <style>
    html,body{width:100%;min-width:0;overflow-x:hidden}
    #root{width:100%;min-height:100vh;display:flex;justify-content:center}
    .app,.main,.auth-shell{width:100%;max-width:390px}
    .app{margin:0 auto;box-shadow:0 0 70px rgba(0,0,0,.28)}

<body>
  <div id="root"></div>
  <div class="modal-backdrop" id="modal"><div class="modal" id="modal-content"></div></div>
  <div class="toast" id="toast"></div>
  <script>
    const KEY='odisseia-completo-local-v4';
    const AUTH_KEY='odisseia-auth-local-v1';
    const ACCOUNTS_KEY='odisseia-accounts-local-v1';
    const DATA_PREFIX='odisseia-user-local-v1-';
    const blankState={profile:{name:'',email:'',motorcycleName:'',motorcycleLink:''},motorcycles:[],maintenance:[],reminders:[],fuelings:[],trips:[],expenses:[],events:[],favorites:[],journal:[],preferences:{eventAlerts:false}};
    let identity=null;let account=null;let state=structuredClone(blankState);let view='home';let authMode='login';let authReady=false;let authError='';
    const navItems=[['home','⌂','Início'],['events','◉','Eventos'],['trips','⌁','Viagens'],['bike','◈','Minha Moto'],['finance','◒','Financeiro'],['journal','▤','Diário'],['settings','⚙','Configurações']];
    const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    const escapeHtml=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
    function loadAccounts(){try{return JSON.parse(localStorage.getItem(ACCOUNTS_KEY)||'[]')}catch{return []}}
    function saveAccounts(accounts){localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(accounts))}
    function getActiveAccount(){const id=localStorage.getItem(AUTH_KEY);return id?loadAccounts().find(a=>a.id===id)||null:null}
    function stateForAccount(acc){return merge(blankState,{profile:{name:acc.name,email:acc.email,motorcycleLink:acc.motorcycleLink||''}})}
    function loadState(){try{if(!account)return structuredClone(blankState);const raw=localStorage.getItem(DATA_PREFIX+account.id);return raw?merge(blankState,JSON.parse(raw)):stateForAccount(account)}catch{return structuredClone(blankState)}}
    function merge(base,extra){return {...structuredClone(base),...extra,onboarding:{...base.onboarding,...(extra.onboarding||{})},profile:{...base.profile,...(extra.profile||{})},preferences:{...base.preferences,...(extra.preferences||{})},motorcycles:Array.isArray(extra.motorcycles)?extra.motorcycles:[],maintenance:Array.isArray(extra.maintenance)?extra.maintenance:[],reminders:Array.isArray(extra.reminders)?extra.reminders:[],fuelings:Array.isArray(extra.fuelings)?extra.fuelings:[],trips:Array.isArray(extra.trips)?extra.trips:[],expenses:Array.isArray(extra.expenses)?extra.expenses:[],events:Array.isArray(extra.events)?extra.events:[],favorites:Array.isArray(extra.favorites)?extra.favorites:[],journal:Array.isArray(extra.journal)?extra.journal:[]}}
    function save(){if(account)localStorage.setItem(DATA_PREFIX+account.id,JSON.stringify(state))}
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2700)}
    function logo(){return '<div class="brand-mark" aria-hidden="true"></div><div class="brand-name">Odisseia</div>'}
    function cardHead(title,sub='',action=''){return `<div class="card-head"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div>${action}</div>`}
    function empty(title,copy,action='',icon='＋',center=false){return `<div class="empty${center?' center':''}"><div class="empty-icon">${icon}</div><h3>${title}</h3><p>${copy}</p>${action}</div>`}
    function safeDate(value){return value?new Date(value+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}):'Sem data'}
    function avatar(){return state.profile.photo?`<div class="avatar"><img src="${state.profile.photo}" alt="Foto de perfil"></div>`:`<div class="avatar">${(state.profile.name||'O').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}</div>`}
    function render(){if(!account){renderAuth();return}renderApp()}
    function renderAuth(){document.getElementById('root').innerHTML=`<main class="auth-shell"><section class="auth-card"><div class="auth-logo">${logo()}</div><span class="badge">APLICATIVO DOS MOTOCICLISTAS</span><h1 class="auth-title" style="margin-top:18px">Sua estrada começa aqui.</h1><p class="auth-copy">Entre no Odisseia para acessar suas viagens, sua moto e suas ferramentas.</p><div class="auth-switch"><button class="${authMode==='login'?'active':''}" data-auth-mode="login">Entrar</button><button class="${authMode==='register'?'active':''}" data-auth-mode="register">Criar conta</button></div>${authMode==='login'?`<div class="form-grid"><div class="field"><label>E-mail</label><input id="auth-email" type="email" autocomplete="email" placeholder="seu@email.com"></div><div class="field"><label>Senha</label><input id="auth-password" type="password" autocomplete="current-password" placeholder="Sua senha"></div><button class="btn" data-action="login">Entrar</button><button class="btn ghost" data-action="forgot-password">Esqueci minha senha</button></div>`:`<div class="form-grid"><div class="field"><label>Nome</label><input id="auth-name" autocomplete="name" placeholder="Seu nome"></div><div class="field"><label>Link da moto</label><input id="auth-motorcycle-link" type="url" placeholder="https://..."></div><div class="field"><label>E-mail</label><input id="auth-email" type="email" autocomplete="email" placeholder="seu@email.com"></div><div class="field"><label>Senha</label><input id="auth-password" type="password" autocomplete="new-password" placeholder="Crie uma senha"></div><div class="field"><label>Confirmar senha</label><input id="auth-confirm" type="password" autocomplete="new-password" placeholder="Repita sua senha"></div><button class="btn" data-action="register">Criar minha conta</button></div>`}<div class="auth-note"><span class="badge">LOCAL</span><span><b>Modo de desenvolvimento.</b> A tela valida o fluxo sem inventar usuário ou dados. Google OAuth, sessão segura e banco precisam ser conectados no backend antes da produção.</span></div><div class="auth-footer">Odisseia Completo · dados individuais por conta</div></section></main>`;bindAuth()}
    async function passwordHash(value){const bytes=new TextEncoder().encode(value);const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('')}
    function bindAuth(){document.querySelectorAll('[data-auth-mode]').forEach(button=>button.addEventListener('click',()=>{authMode=button.dataset.authMode;renderAuth()}));document.querySelector('[data-action="forgot-password"]')?.addEventListener('click',()=>toast('Recuperação de acesso exige o backend de autenticação.'));document.querySelector('[data-action="login"]')?.addEventListener('click',async()=>{const email=document.getElementById('auth-email').value.trim().toLowerCase(),password=document.getElementById('auth-password').value;if(!email||!password){toast('Informe e-mail e senha.');return}const hash=await passwordHash(password),found=loadAccounts().find(a=>a.email===email&&a.passwordHash===hash);if(!found){toast('Conta não encontrada ou senha inválida.');return}localStorage.setItem(AUTH_KEY,found.id);account=found;state=loadState();view='home';render()});document.querySelector('[data-action="register"]')?.addEventListener('click',async()=>{const name=document.getElementById('auth-name').value.trim(),motorcycleLink=document.getElementById('auth-motorcycle-link').value.trim(),email=document.getElementById('auth-email').value.trim().toLowerCase(),password=document.getElementById('auth-password').value,confirmPassword=document.getElementById('auth-confirm').value;if(!name||!motorcycleLink||!email||!password){toast('Preencha nome, link da moto, e-mail e senha.');return}if(password.length<6){toast('Use uma senha com pelo menos 6 caracteres.');return}if(password!==confirmPassword){toast('As senhas não conferem.');return}const accounts=loadAccounts();if(accounts.some(a=>a.email===email)){toast('Já existe uma conta com este e-mail.');return}const created={id:uid(),name,motorcycleLink,email,passwordHash:await passwordHash(password)};accounts.push(created);saveAccounts(accounts);localStorage.setItem(AUTH_KEY,created.id);account=created;state=stateForAccount(created);save();view='home';render()})}
    function renderSetup(){const step=state.onboarding.step||1;document.getElementById('root').innerHTML=`<main class="setup-shell"><section class="setup-card"><div class="setup-top"><div class="setup-brand">${logo()}</div><span class="badge">PLANO COMPLETO</span></div><div class="eyebrow">Configuração inicial · etapa ${step} de 4</div><div class="stepper">${[1,2,3,4].map(n=>`<div class="step ${n<step?'done':''} ${n===step?'active':''}"></div>`).join('')}</div>${setupContent(step)}</section></main>`;bindSetup()}
    function setupContent(step){const p=state.profile,m=state.motorcycles[0]||{};if(step===1)return `<h1 class="setup-title">Vamos preparar seu Odisseia.</h1><p class="setup-copy">Comece com o essencial. Você poderá editar tudo depois, sem preencher um formulário enorme.</p><div class="auth-notice"><div class="badge">LOCAL</div><div><strong>Autenticação de produção ainda não configurada</strong><p>Este ambiente trabalha localmente neste navegador. Para ativar Google OAuth com sessão segura, configure o backend descrito na documentação de produção.</p></div><button class="btn small secondary" data-action="auth-info">Ver configuração</button></div><div class="form-grid"><div class="field"><label for="setup-name">Como devemos chamar você?</label><input id="setup-name" value="${escapeHtml(p.name)}" placeholder="Seu nome" autocomplete="name"></div><div class="grid two-col"><div class="field"><label for="setup-city">Cidade</label><input id="setup-city" value="${escapeHtml(p.city)}" placeholder="Sua cidade"></div><div class="field"><label for="setup-state">Estado</label><select id="setup-state"><option value="">Selecione</option>${['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO'].map(s=>`<option ${p.state===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="field"><label for="setup-photo">Foto de perfil <span class="muted">(opcional)</span></label><input id="setup-photo" type="file" accept="image/*"></div></div><div class="form-actions"><button class="btn" data-action="setup-next">Continuar para minha moto →</button></div>`;if(step===2)return `<h1 class="setup-title">Qual moto leva você?</h1><p class="setup-copy">Cadastre sua primeira motocicleta. Se preferir, você pode fazer isso mais tarde pelo menu Minha Moto.</p><div class="form-grid"><div class="grid two-col"><div class="field"><label>Marca</label><input id="bike-brand" value="${escapeHtml(m.brand||'')}" placeholder="Ex.: sua marca"></div><div class="field"><label>Modelo</label><input id="bike-model" value="${escapeHtml(m.model||'')}" placeholder="Ex.: seu modelo"></div></div><div class="grid three-col"><div class="field"><label>Ano</label><input id="bike-year" type="number" value="${escapeHtml(m.year||'')}" placeholder="Ano"></div><div class="field"><label>Cor</label><input id="bike-color" value="${escapeHtml(m.color||'')}" placeholder="Cor"></div><div class="field"><label>Quilometragem</label><input id="bike-odometer" type="number" value="${escapeHtml(m.odometer||'')}" placeholder="0"></div></div><div class="field"><label>Consumo médio <span class="muted">(opcional, km/L)</span></label><input id="bike-consumption" type="number" step="0.1" value="${escapeHtml(m.consumption||'')}" placeholder="km/L"></div><div class="field"><label>Foto da moto <span class="muted">(opcional)</span></label><input id="bike-photo" type="file" accept="image/*"></div></div><div class="form-actions"><button class="btn secondary" data-action="setup-back">← Voltar</button><button class="btn ghost" data-action="setup-skip-bike">Fazer depois</button><button class="btn" data-action="setup-bike">Salvar e continuar →</button></div>`;if(step===3)return `<h1 class="setup-title">Registrar a última manutenção?</h1><p class="setup-copy">Isso é opcional. Só salve o que você souber — nada será presumido como feito.</p>${state.motorcycles.length?`<div class="form-grid"><div class="field"><label>Serviço</label><select id="maint-type"><option>Troca de óleo</option><option>Revisão da corrente</option><option>Troca de pneus</option><option>Revisão dos freios</option><option>Revisão geral</option><option>Outro</option></select></div><div class="grid two-col"><div class="field"><label>Data</label><input id="maint-date" type="date"></div><div class="field"><label>Quilometragem</label><input id="maint-odometer" type="number" placeholder="Opcional"></div></div><div class="grid two-col"><div class="field"><label>Valor     function renderApp(){const title={home:`Olá, ${escapeHtml(state.profile.name||'motociclista')}!`,events:'Eventos',trips:'Viagens',bike:'Minha Moto',finance:'Financeiro',journal:'Diário',settings:'Configurações'}[view]||'Odisseia';document.getElementById('root').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand">${logo()}</div><div class="nav-label eyebrow">Seu painel</div><nav class="nav">${navItems.map(([id,icon,label])=>`<button class="nav-btn ${view===id?'active':''}" data-view="${id}"><span class="nav-icon">${icon}</span>${label}</button>`).join('')}</nav><div class="side-bottom"><div class="local-card"><span class="badge">AMBIENTE LOCAL</span><strong>Odisseia Completo</strong><p>Dados persistidos neste navegador enquanto o backend não está conectado.</p></div><div class="profile">${avatar()}<div><b>${escapeHtml(state.profile.name||'Seu perfil')}</b><span>${escapeHtml(state.profile.city||'Cidade não informada')}${state.profile.state?' · '+state.profile.state:''}</span></div></div></div></aside><main class="main"><header class="topbar"><div><h1 id="page-title">${title}</h1><p>Pronto para sua próxima aventura?</p></div><div class="top-actions"><span class="badge">COMPLETO</span><button class="icon-btn" data-action="logout" aria-label="Sair">↪</button><button class="icon-btn" data-view="settings" aria-label="Configurações">⚙</button></div></header><div class="content"><section id="home" class="view ${view==='home'?'active':''}"></section><section id="events" class="view ${view==='events'?'active':''}"></section><section id="trips" class="view ${view==='trips'?'active':''}"></section><section id="bike" class="view ${view==='bike'?'active':''}"></section><section id="finance" class="view ${view==='finance'?'active':''}"></section><section id="journal" class="view ${view==='journal'?'active':''}"></section><section id="settings" class="view ${view==='settings'?'active':''}"></section></div></main></div><nav class="bottom-nav">${navItems.slice(0,5).map(([id,icon,label])=>`<button class="${view===id?'active':''}" data-view="${id}"><i>${icon}</i>${label.replace('Minha Moto','Moto')}</button>`).join('')}</nav>`;homeView();eventsView();tripsView();bikeView();financeView();journalView();settingsView();bindApp()}
    function homeView(){const bike=state.motorcycles[0];const nextMaint=[...state.reminders].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'))[0];const trip=[...state.trips].sort((a,b)=>(a.startDate||'9999').localeCompare(b.startDate||'9999'))[0];const event=state.events[0];const total=state.expenses.reduce((s,e)=>s+Number(e.amount||0),0);document.getElementById('home').innerHTML=`<div class="hero"><div><div class="eyebrow">Seu painel pessoal</div><h2>Uma visão limpa da<br><span style="color:var(--orange)">sua próxima rota.</span></h2><p>O que importa agora, organizado para você sair da tela e ir para a estrada.</p></div><button class="btn" data-action="new-trip">＋ Planejar viagem</button></div><div class="grid stats"><div class="card stat"><div class="stat-label">Minha moto</div><div class="stat-value" style="font-size:20px">${bike?escapeHtml(bike.model||'Modelo não informado'):'Ainda não cadastrada'}</div><div class="stat-note">${bike?`${escapeHtml(bike.color||'Cor não informada')} · ${Number(bike.odometer||0).toLocaleString('pt-BR')} km`:'Cadastre para acompanhar sua moto'}</div></div><div class="card stat"><div class="stat-label">Próxima manutenção</div><div class="stat-value" style="font-size:20px">${nextMaint?escapeHtml(nextMaint.type):'Nenhum lembrete'}</div><div class="stat-note">${nextMaint?safeDate(nextMaint.date):'Você decide quando lembrar'}</div></div><div class="card stat"><div class="stat-label">Próxima viagem</div><div class="stat-value" style="font-size:20px">${trip?escapeHtml(trip.name):'Nenhuma planejada'}</div><div class="stat-note">${trip?`${safeDate(trip.startDate)} · ${Number(trip.distance||0).toLocaleString('pt-BR')} km`:'Planeje uma nova aventura'}</div></div><div class="card stat"><div class="stat-label">Gastos registrados</div><div class="stat-value">${money(total)}</div><div class="stat-note">${state.expenses.length} lançamento${state.expenses.length===1?'':'s'} no histórico</div></div></div><div class="grid two-col"><div class="grid"><article class="card">${cardHead('Minha Moto','Dados atuais da motocicleta',bike?'<button class="btn ghost" data-view="bike">Abrir →</button>':'')} ${bike?`<div class="maintenance"><div class="bike-art">🏍</div><div><strong>${escapeHtml(bike.brand||'Marca não informada')} ${escapeHtml(bike.model||'')}</strong><p>${escapeHtml(bike.color||'Cor não informada')} · ${Number(bike.odometer||0).toLocaleString('pt-BR')} km</p></div></div>`:empty('Nenhuma moto cadastrada','Adicione sua moto para acompanhar quilometragem, abastecimentos e manutenção.','<button class="btn small" data-action="new-bike">Cadastrar minha moto</button>','🏍')}</article><article class="card">${cardHead('Próxima viagem','Seu próximo plano de estrada',trip?'<button class="btn ghost" data-view="trips">Ver viagens →</button>':'')} ${trip?`<div class="list-row"><div class="category">⌁</div><div><strong>${escapeHtml(trip.name)}</strong><span>${escapeHtml(trip.origin||'Origem não informada')} → ${escapeHtml(trip.destination||'Destino não informado')} · ${safeDate(trip.startDate)}</span></div><span class="pill">Planejada</span></div>`:empty('Nenhuma viagem planejada','Organize rota, datas, distância e paradas em um só lugar.','<button class="btn small" data-action="new-trip">Planejar viagem</button>','⌁')}</article></div><div class="grid"><article class="card">${cardHead('Eventos próximos','Somente eventos cadastrados no radar',state.events.length?'<button class="btn ghost" data-view="events">Abrir radar →</button>':'')} ${event?eventRow(event):empty('Nenhum evento encontrado','Ainda não há eventos cadastrados. Explore o radar ou tente novamente mais tarde.','<button class="btn small secondary" data-view="events">Explorar eventos</button>','◉')}</article><article class="card">${cardHead('Atalhos úteis','Ações rápidas para o seu dia')}<div class="grid three-col"><button class="card flat" data-action="new-maintenance" style="text-align:left;color:var(--text)"><div class="category">⚒</div><strong style="display:block;margin-top:11px">Adicionar manutenção</strong><span class="muted" style="font-size:11px">Registre o que foi feito</span></button><button class="card flat" data-action="new-fuel" style="text-align:left;color:var(--text)"><div class="category">⛽</div><strong style="display:block;margin-top:11px">Registrar abastecimento</strong><span class="muted" style="font-size:11px">Acompanhe seu consumo</span></button><button class="card flat" data-action="new-expense" style="text-align:left;color:var(--text)"><div class="category">◒</div><strong style="display:block;margin-top:11px">Adicionar despesa</strong><span class="muted" style="font-size:11px">Pedágio, comida e extras</span></button></div></article></div></div>`}
    function eventRow(e){return `<div class="event"><div class="event-date"><b>${e.date?new Date(e.date+'T12:00:00').getDate():'—'}</b>${e.date?new Date(e.date+'T12:00:00').toLocaleDateString('pt-BR',{month:'short'}).replace('.','').toUpperCase():'—'}</div><div class="event-info"><strong>${escapeHtml(e.name)}</strong><span>⌖ ${escapeHtml(e.city||'Local não informado')} · ${escapeHtml(e.state||'')}</span></div><div class="event-actions"><button class="icon-action ${state.favorites.includes(e.id)?'active':''}" data-fav="${e.id}" aria-label="Favoritar evento">★</button><button class="icon-action" data-event="${e.id}" aria-label="Ver detalhes">›</button></div></div>`}
    function eventsView(){const search=window.eventFilters?.search||'';const uf=window.eventFilters?.state||'';const filtered=state.events.filter(e=>(!search||(e.name+' '+e.city+' '+e.description).toLowerCase().includes(search.toLowerCase()))&&(!uf||e.state===uf));document.getElementById('events').innerHTML=`<div class="hero"><div><div class="eyebrow">Radar de encontros</div><h2>Encontre o próximo<br><span style="color:var(--orange)">ponto da sua rota.</span></h2><p>O radar exibe apenas eventos cadastrados. Nenhum evento é inventado automaticamente.</p></div><button class="btn" data-action="new-event">＋ Cadastrar evento</button></div><div class="toolbar"><div class="field"><label>Buscar por cidade ou evento</label><input id="event-search" value="${escapeHtml(search)}" placeholder="Ex.: Petrópolis"></div><div class="field"><label>Estado</label><select id="event-state"><option value="">Todos os estados</option>${['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO'].map(s=>`<option ${uf===s?'selected':''}>${s}</option>`).join('')}</select></div><button class="btn secondary" data-action="toggle-alerts">${state.preferences.eventAlerts?'✓ Alertas ativos':'Ativar alertas'}</button></div><div class="grid two-col"><article class="card">${cardHead('Mapa de encontros','A integração de mapa usa coordenadas cadastradas pelo administrador')}${state.events.length?`<div class="map"><div class="map-empty"><div><h3>${filtered.length} evento${filtered.length===1?'':'s'} no radar</h3><p>Conecte um provedor de mapas para renderizar marcadores geográficos. Por enquanto, abra os detalhes na lista.</p></div></div></div>`:empty('Nenhum evento encontrado','Tente ajustar os filtros ou cadastre o primeiro evento.','','◉',true)}</article><article class="card">${cardHead('Agenda','Eventos persistidos neste ambiente',state.events.length?`<span class="pill">${filtered.length} encontrado${filtered.length===1?'':'s'}</span>`:'')}${filtered.length?`<div class="event-list" id="event-list">${filtered.map(eventRow).join('')}</div>`:empty('Nenhum evento encontrado','Tente ajustar os filtros.','','◉',true)}</article></div><article class="card" style="margin-top:16px">${cardHead('Administração local de eventos','Esta área é apenas para validar o fluxo enquanto o backend e as permissões administrativas não estão conectados.','<span class="badge">ADMIN BACKEND PENDENTE</span>')}${state.events.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Evento</th><th>Data</th><th>Local</th><th>Ações</th></tr></thead><tbody>${state.events.map(e=>`<tr><td><b>${escapeHtml(e.name)}</b><br><span class="muted">${escapeHtml(e.officialUrl||'Sem link oficial')}</span></td><td>${safeDate(e.date)}</td><td>${escapeHtml(e.city||'')} · ${escapeHtml(e.state||'')}</td><td><button class="btn ghost" data-edit-event="${e.id}">Editar</button> <button class="btn ghost" style="color:#ff8d8d" data-delete-event="${e.id}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:empty('Nenhum evento cadastrado','Use “Cadastrar evento” para alimentar o radar com uma fonte real.','','＋',true)}</article>`;bindEventFilters()}
    function tripsView(){const trips=state.trips;document.getElementById('trips').innerHTML=`<div class="hero"><div><div class="eyebrow">Planejador de viagens</div><h2>Desenhe a rota.<br><span style="color:var(--orange)">Viva o caminho.</span></h2><p>Crie viagens reais, estime combustível e organize suas paradas.</p></div><button class="btn" data-action="new-trip">＋ Nova viagem</button></div><div class="grid two-col"><div class="grid"><article class="card">${cardHead('Minhas viagens','Somente viagens criadas por você')}${trips.length?`<div class="list">${trips.map(t=>`<div class="list-row"><div class="category">⌁</div><div><strong>${escapeHtml(t.name)}</strong><span>${escapeHtml(t.origin||'')} → ${escapeHtml(t.destination||'')} · ${safeDate(t.startDate)} · ${Number(t.distance||0).toLocaleString('pt-BR')} km</span></div><div><button class="icon-action" data-stop="${t.id}" title="Adicionar parada">＋</button><button class="icon-action" data-delete-trip="${t.id}" title="Excluir viagem">×</button></div></div>`).join('')}</div>`:empty('Nenhuma viagem criada','Comece com origem, destino e data. Você poderá adicionar paradas depois.','<button class="btn small" data-action="new-trip">Criar primeira viagem</button>','⌁',true)}</article><article class="card">${cardHead('Paradas da viagem','Paradas salvas nas suas viagens')}${trips.some(t=>t.stops?.length)?trips.flatMap(t=>(t.stops||[]).map(s=>`<div class="list-row"><div class="category">${s.type==='Combustível'?'⛽':s.type==='Alimentação'?'♨':'⌁'}</div><div><strong>${escapeHtml(s.name)}</strong><span>${escapeHtml(s.type)} · ${escapeHtml(s.notes||'Sem observações')}</span></div><span class="muted">${escapeHtml(t.name)}</span></div>`)).join(''):empty('Nenhuma parada adicionada','Abra uma viagem e adicione combustível, alimentação, descanso ou apoio.','','⌁',true)}</article></div><article class="card"><h3 style="margin:0 0 4px">Calculadora de combustível</h3><p class="muted" style="font-size:12px;margin:0 0 18px">Use dados da sua moto ou informe manualmente.</p><div class="form-grid"><div class="field"><label>Distância (km)</label><input id="fuel-distance" type="number" placeholder="430"></div><div class="field"><label>Consumo médio (km/L)</label><input id="fuel-consumption" type="number" step="0.1" value="${state.motorcycles[0]?.consumption||''}" placeholder="18.6"></div><div class="field"><label>Preço do litro</label><input id="fuel-price" type="number" step="0.01" placeholder="6,19"></div><label style="display:flex;gap:9px;align-items:center;font-size:12px;color:#c7ccd3"><input id="fuel-roundtrip" type="checkbox" style="width:auto;accent-color:var(--orange)"> Calcular ida e volta</label><button class="btn" id="fuel-calc">Calcular estimativa</button><div id="fuel-result" class="card flat" style="background:#11161b;display:flex;justify-content:space-between;align-items:center"><span class="muted" style="font-size:12px">Custo estimado</span><strong style="font-size:20px;color:var(--orange2)">—</strong></div></div></article></div>`;bindFuel()}
    function bikeView(){const bikes=state.motorcycles;const maint=[...state.maintenance].sort((a,b)=>(b.date||'').localeCompare(a.date||''));const rem=[...state.reminders].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));document.getElementById('bike').innerHTML=`<div class="hero"><div><div class="eyebrow">Minha moto</div><h2>Cuide da máquina<br><span style="color:var(--orange)">que leva você.</span></h2><p>Cadastre suas motos, acompanhe abastecimentos e mantenha um histórico que não se perde.</p></div><button class="btn" data-action="new-bike">＋ Cadastrar moto</button></div><div class="grid three-col"><article class="card">${cardHead('Minhas motocicletas','Você pode cadastrar mais de uma')} ${bikes.length?`<div class="list">${bikes.map(b=>`<div class="list-row"><div class="bike-art" style="width:48px;height:48px;font-size:22px">🏍</div><div><strong>${escapeHtml(b.brand||'Marca não informada')} ${escapeHtml(b.model||'')}</strong><span>${escapeHtml(b.color||'Cor não informada')} · ${Number(b.odometer||0).toLocaleString('pt-BR')} km</span></div><button class="icon-action" data-edit-bike="${b.id}">✎</button></div>`).join('')}</div>`:empty('Nenhuma moto cadastrada','Cadastre sua primeira motocicleta para liberar os controles de consumo e manutenção.','<button class="btn small" data-action="new-bike">Cadastrar minha moto</button>','🏍',true)}</article><article class="card">${cardHead('Abastecimentos','Registros válidos calculam seu consumo')} ${state.fuelings.length?`<div class="list">${state.fuelings.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5).map(f=>`<div class="list-row"><div class="category">⛽</div><div><strong>${safeDate(f.date)} · ${Number(f.liters||0).toLocaleString('pt-BR')} L</strong><span>${escapeHtml(f.station||'Posto não informado')} · ${Number(f.odometer||0).toLocaleString('pt-BR')} km</span></div><b class="amount">${money(f.total)}</b></div>`).join('')}</div><button class="btn small secondary" style="margin-top:16px" data-action="new-fuel">＋ Adicionar abastecimento</button>`:empty('Nenhum abastecimento','Registre litros, quilometragem e valor para acompanhar o consumo.','<button class="btn small" data-action="new-fuel">Registrar abastecimento</button>','⛽',true)}</article><article class="card">${cardHead('Próximos lembretes','Somente lembretes criados por você')} ${rem.length?rem.slice(0,4).map(r=>`<div class="reminder"><div class="mini-icon">⌁</div><div><strong>${escapeHtml(r.type)}</strong><span>${r.date?safeDate(r.date):''}${r.odometer?' · '+Number(r.odometer).toLocaleString('pt-BR')+' km':''}</span></div><button class="icon-action" data-delete-reminder="${r.id}">×</button></div>`).join(''):empty('Nenhum lembrete','Registre uma manutenção e defina o próximo prazo.','','⌁',true)}</article></div><article class="card" style="margin-top:16px">${cardHead('Histórico de manutenção','Registros cronológicos da sua moto','<button class="btn ghost" data-action="new-maintenance">＋ Adicionar</button>')}${maint.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Serviço</th><th>Data</th><th>Quilometragem</th><th>Valor</th><th></th></tr></thead><tbody>${maint.map(m=>`<tr><td><b>${escapeHtml(m.type)}</b><br><span class="muted">${escapeHtml(m.shop||'Oficina não informada')}</span></td><td>${safeDate(m.date)}</td><td>${m.odometer?Number(m.odometer).toLocaleString('pt-BR')+' km':'—'}</td><td class="amount">${m.cost?money(m.cost):'—'}</td><td><button class="btn ghost" data-edit-maint="${m.id}">Editar</button> <button class="btn ghost" style="color:#ff8d8d" data-delete-maint="${m.id}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:empty('Histórico vazio','Nenhuma manutenção foi marcada como realizada.','','⚒',true)}</article>`}
    function financeView(){const total=state.expenses.reduce((s,e)=>s+Number(e.amount||0),0);const categories={};state.expenses.forEach(e=>categories[e.category]=(categories[e.category]||0)+Number(e.amount||0));document.getElementById('finance').innerHTML=`<div class="hero"><div><div class="eyebrow">Seu financeiro</div><h2>Entenda seus custos.<br><span style="color:var(--orange)">Rode mais leve.</span></h2><p>Pedágios, combustível, manutenção e extras em um histórico seu.</p></div><button class="btn" data-action="new-expense">＋ Adicionar despesa</button></div><div class="grid stats"><div class="card stat"><div class="stat-label">Total registrado</div><div class="stat-value">${money(total)}</div><div class="stat-note">${state.expenses.length} lançamento${state.expenses.length===1?'':'s'}</div></div><div class="card stat"><div class="stat-label">Abastecimentos</div><div class="stat-value">${state.fuelings.length}</div><div class="stat-note">Registros da sua moto</div></div><div class="card stat"><div class="stat-label">Viagens com custo</div><div class="stat-value">${new Set(state.expenses.map(e=>e.tripId).filter(Boolean)).size}</div><div class="stat-note">Relacionadas a despesas</div></div><div class="card stat"><div class="stat-label">Relatórios</div><div class="stat-value" style="font-size:20px">CSV disponível</div><div class="stat-note">PDF/XLSX dependem do backend</div></div></div><div class="grid two-col"><article class="card">${cardHead('Categorias','Distribuição dos lançamentos')}${Object.keys(categories).length?Object.entries(categories).map(([cat,val])=>`<div class="list-row"><div class="category">◒</div><div><strong>${escapeHtml(cat)}</strong><span>${((val/total)*100).toFixed(0)}% do total</span></div><b class="amount">${money(val)}</b></div>`).join(''):empty('Sem despesas','Seus gastos aparecerão aqui depois do primeiro lançamento.','','◒',true)}</article><article class="card">${cardHead('Exportação','Baixe seus dados filtrados')}${empty('Relatórios avançados','A exportação CSV já funciona localmente. PDF e XLSX exigem um serviço de geração no backend.','<button class="btn small" data-action="export-csv">Exportar CSV</button>','↓',true)}</article></div><article class="card" style="margin-top:16px">${cardHead('Lançamentos','Dados persistidos neste ambiente local')}${state.expenses.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Categoria</th><th>Detalhe</th><th>Data</th><th>Valor</th><th></th></tr></thead><tbody>${state.expenses.map(e=>`<tr><td><span class="pill" style="color:#ffd0b0;background:rgba(255,106,0,.12)">${escapeHtml(e.category)}</span></td><td>${escapeHtml(e.detail||'')}</td><td>${safeDate(e.date)}</td><td class="amount">${money(e.amount)}</td><td><button class="btn ghost" style="color:#ff8d8d" data-delete-expense="${e.id}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:empty('Nenhum lançamento','Comece registrando combustível, pedágio, alimentação ou outra despesa.','<button class="btn small" data-action="new-expense">Adicionar despesa</button>','◒',true)}</article>`}
    function journalView(){document.getElementById('journal').innerHTML=`<div class="hero"><div><div class="eyebrow">Diário de viagens</div><h2>Guarde os detalhes<br><span style="color:var(--orange)">que a rota não conta.</span></h2><p>Registre suas experiências, fotos e observações com dados reais das suas viagens.</p></div><button class="btn" data-action="new-journal">＋ Novo registro</button></div><article class="card">${cardHead('Minhas memórias','Registros criados por você')}${state.journal.length?`<div class="grid two-col">${state.journal.map(j=>`<article class="empty" style="min-height:170px"><div class="eyebrow" style="color:#ff9b50">${safeDate(j.date)}</div><h3 style="font-size:19px;margin-top:7px">${escapeHtml(j.title)}</h3><p>${escapeHtml(j.description||'Sem descrição')}</p><button class="btn ghost" data-edit-journal="${j.id}">Editar →</button></article>`).join('')}</div>`:empty('Seu diário está vazio','Depois de uma viagem, registre o que ficou na memória.','','▤',true)}</article>`}
    function settingsView(){document.getElementById('settings').innerHTML=`<div class="hero"><div><div class="eyebrow">Configurações</div><h2>Seu Odisseia,<br><span style="color:var(--orange)">do seu jeito.</span></h2><p>Perfil, preferências e as integrações necessárias para produção.</p></div></div><div class="grid two-col"><article class="card"><h3 style="margin:0 0 17px">Perfil</h3><div class="form-grid"><div class="field"><label>Nome</label><input id="profile-name" value="${escapeHtml(state.profile.name)}"></div><div class="grid two-col"><div class="field"><label>Cidade</label><input id="profile-city" value="${escapeHtml(state.profile.city)}"></div><div class="field"><label>Estado</label><input id="profile-state" value="${escapeHtml(state.profile.state)}"></div></div></div><button class="btn small" style="margin-top:17px" data-action="save-profile">Salvar alterações</button></article><article class="card"><h3 style="margin:0 0 6px">Notificações</h3><p class="muted" style="font-size:12px;margin:0 0 15px">Escolha se deseja ser avisado sobre novos encontros.</p><label style="display:flex;gap:10px;align-items:center;font-size:13px"><input id="alert-toggle" type="checkbox" style="width:auto;accent-color:var(--orange)" ${state.preferences.eventAlerts?'checked':''}> Alertas de encontros</label><div class="auth-notice" style="margin-top:18px;margin-bottom:0"><div class="badge">AUTH</div><div><strong>Google OAuth e sessão segura</strong><p>Configure Google Client ID/Secret, banco e SESSION_SECRET no backend para ativar contas reais. Este front-end não inventa login.</p></div><button class="btn small secondary" data-action="auth-info">Detalhes</button></div></article></div><article class="card" style="margin-top:16px">${cardHead('Dados locais','Limpe somente os dados deste navegador','<span class="badge">DESENVOLVIMENTO</span>')}<p class="muted" style="font-size:12px">A versão atual usa localStorage para permitir testes sem banco. Em produção, estes registros devem migrar para tabelas vinculadas ao usuário autenticado.</p><button class="btn small secondary" data-action="reset-local">Limpar ambiente local</button></article>`}
    function bindSetup(){document.querySelector('[data-action="auth-info"]')?.addEventListener('click',showAuthInfo);document.querySelector('[data-action="setup-next"]')?.addEventListener('click',()=>{const name=document.getElementById('setup-name').value.trim();if(!name){toast('Informe seu nome para continuar.');return}state.profile.name=name;state.profile.city=document.getElementById('setup-city').value.trim();state.profile.state=document.getElementById('setup-state').value;const file=document.getElementById('setup-photo').files[0];if(file){const reader=new FileReader();reader.onload=()=>{state.profile.photo=reader.result;state.onboarding.step=2;save();render()};reader.readAsDataURL(file)}else{state.onboarding.step=2;save();render()}});document.querySelector('[data-action="setup-bike"]')?.addEventListener('click',()=>{const brand=document.getElementById('bike-brand').value.trim(),model=document.getElementById('bike-model').value.trim();if(!brand||!model){toast('Informe marca e modelo, ou escolha “Fazer depois”.');return}const bike={id:uid(),brand,model,year:document.getElementById('bike-year').value,color:document.getElementById('bike-color').value.trim(),odometer:Number(document.getElementById('bike-odometer').value||0),consumption:Number(document.getElementById('bike-consumption').value||0),photo:''};const file=document.getElementById('bike-photo').files[0];const next=()=>{state.motorcycles=[bike];state.onboarding.step=3;save();render()};if(file){const reader=new FileReader();reader.onload=()=>{bike.photo=reader.result;next()};reader.readAsDataURL(file)}else next()});document.querySelector('[data-action="setup-skip-bike"]')?.addEventListener('click',()=>{state.onboarding.step=3;save();render()});document.querySelector('[data-action="setup-maint"]')?.addEventListener('click',saveSetupMaintenance);document.querySelector('[data-action="setup-skip-maint"]')?.addEventListener('click',()=>{state.onboarding.step=4;save();render()});document.querySelector('[data-action="setup-back"]')?.addEventListener('click',()=>{state.onboarding.step=Math.max(1,state.onboarding.step-1);save();render()});document.querySelector('[data-action="finish-setup"]')?.addEventListener('click',()=>{state.onboarding.done=true;save();view='home';render()})}
    function saveSetupMaintenance(){if(!state.motorcycles.length){state.onboarding.step=4;save();render();return}const date=document.getElementById('maint-date').value;if(!date){toast('Informe a data ou pule esta etapa.');return}const m={id:uid(),motorcycleId:state.motorcycles[0].id,type:document.getElementById('maint-type').value,date,odometer:Number(document.getElementById('maint-odometer').value||0),cost:Number(document.getElementById('maint-cost').value||0),shop:document.getElementById('maint-shop').value.trim()};state.maintenance.push(m);const reminderDate=document.getElementById('reminder-date').value;if(reminderDate)state.reminders.push({id:uid(),motorcycleId:m.motorcycleId,type:m.type,date:reminderDate});state.onboarding.step=4;save();render()}
    function bindApp(){document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;renderApp()}));document.querySelectorAll('[data-action="new-bike"]').forEach(b=>b.addEventListener('click',()=>showBikeModal()));document.querySelectorAll('[data-action="new-maintenance"]').forEach(b=>b.addEventListener('click',()=>showMaintenanceModal()));document.querySelectorAll('[data-action="new-fuel"]').forEach(b=>b.addEventListener('click',()=>showFuelModal()));document.querySelectorAll('[data-action="new-expense"]').forEach(b=>b.addEventListener('click',()=>showExpenseModal()));document.querySelectorAll('[data-action="new-trip"]').forEach(b=>b.addEventListener('click',()=>showTripModal()));document.querySelectorAll('[data-action="new-event"]').forEach(b=>b.addEventListener('click',()=>showEventModal()));document.querySelectorAll('[data-action="new-journal"]').forEach(b=>b.addEventListener('click',()=>showJournalModal()));document.querySelectorAll('[data-action="auth-info"]').forEach(b=>b.addEventListener('click',showAuthInfo));document.querySelectorAll('[data-action="toggle-alerts"]').forEach(b=>b.addEventListener('click',()=>{state.preferences.eventAlerts=!state.preferences.eventAlerts;save();renderApp();toast(state.preferences.eventAlerts?'Alertas ativados neste ambiente.':'Alertas desativados.')}));document.querySelectorAll('[data-action="export-csv"]').forEach(b=>b.addEventListener('click',exportCsv));document.querySelectorAll('[data-action="save-profile"]').forEach(b=>b.addEventListener('click',()=>{state.profile.name=document.getElementById('profile-name').value.trim();state.profile.city=document.getElementById('profile-city').value.trim();state.profile.state=document.getElementById('profile-state').value.trim().toUpperCase();save();renderApp();toast('Perfil salvo localmente.')}));document.querySelectorAll('[data-action="reset-local"]').forEach(b=>b.addEventListener('click',()=>{if(confirm('Limpar todos os dados locais do Odisseia?')){localStorage.removeItem(KEY);location.reload()}}));document.querySelectorAll('[data-event]').forEach(b=>b.addEventListener('click',()=>showEventDetails(b.dataset.event)));document.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',()=>toggleFavorite(b.dataset.fav)));document.querySelectorAll('[data-edit-event]').forEach(b=>b.addEventListener('click',()=>showEventModal(b.dataset.editEvent)));document.querySelectorAll('[data-delete-event]').forEach(b=>b.addEventListener('click',()=>deleteItem('events',b.dataset.deleteEvent)));document.querySelectorAll('[data-edit-bike]').forEach(b=>b.addEventListener('click',()=>showBikeModal(b.dataset.editBike)));document.querySelectorAll('[data-edit-maint]').forEach(b=>b.addEventListener('click',()=>showMaintenanceModal(b.dataset.editMaint)));document.querySelectorAll('[data-delete-maint]').forEach(b=>b.addEventListener('click',()=>deleteItem('maintenance',b.dataset.deleteMaint)));document.querySelectorAll('[data-delete-reminder]').forEach(b=>b.addEventListener('click',()=>deleteItem('reminders',b.dataset.deleteReminder)));document.querySelectorAll('[data-delete-expense]').forEach(b=>b.addEventListener('click',()=>deleteItem('expenses',b.dataset.deleteExpense)));document.querySelectorAll('[data-delete-trip]').forEach(b=>b.addEventListener('click',()=>deleteItem('trips',b.dataset.deleteTrip)));document.querySelectorAll('[data-stop]').forEach(b=>b.addEventListener('click',()=>showStopModal(b.dataset.stop)));document.querySelectorAll('[data-edit-journal]').forEach(b=>b.addEventListener('click',()=>showJournalModal(b.dataset.editJournal)))}
    function bindEventFilters(){document.getElementById('event-search')?.addEventListener('input',e=>{window.eventFilters={...(window.eventFilters||{}),search:e.target.value};eventsView();bindApp()});document.getElementById('event-state')?.addEventListener('change',e=>{window.eventFilters={...(window.eventFilters||{}),state:e.target.value};eventsView();bindApp()})}
    function bindFuel(){document.getElementById('fuel-calc')?.addEventListener('click',()=>{const d=Number(document.getElementById('fuel-distance').value),c=Number(document.getElementById('fuel-consumption').value),p=Number(document.getElementById('fuel-price').value),round=document.getElementById('fuel-roundtrip').checked;if(!(d>0&&c>0&&p>0)){toast('Informe distância, consumo e preço para calcular.');return}const liters=d/c*(round?2:1),cost=liters*p;document.getElementById('fuel-result').innerHTML=`<span class="muted" style="font-size:12px">${liters.toFixed(1)} litros estimados</span><strong style="font-size:20px;color:var(--orange2)">${money(cost)}</strong>`})}
    function openModal(html){document.getElementById('modal-content').innerHTML=html;document.getElementById('modal').classList.add('open');document.querySelector('[data-close-modal]')?.addEventListener('click',closeModal)}function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
    function showAuthInfo(){openModal(`<div class="eyebrow" style="color:#ff9b50">Configuração externa</div><h3>Autenticação real não deve ser simulada.</h3><p>Para produção, conecte Google OAuth no backend com GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, uma URL de callback HTTPS, SESSION_SECRET e banco de dados. O servidor deve validar o token, criar a sessão e aplicar isolamento por usuário.</p><div class="empty"><h3>Estado atual</h3><p>O front-end está em modo local para validar UX e fluxos. Nenhuma senha, conta Google ou sessão falsa é criada.</p></div><div class="form-actions"><button class="btn" data-close-modal>Entendi</button></div>`)}
    function showBikeModal(id){const b=state.motorcycles.find(x=>x.id===id)||{};openModal(`<div class="eyebrow" style="color:#ff9b50">Minha moto</div><h3>${id?'Editar motocicleta':'Cadastrar motocicleta'}</h3><p>Salve apenas dados fornecidos por você.</p><div class="form-grid"><div class="grid two-col"><div class="field"><label>Marca</label><input id="m-brand" value="${escapeHtml(b.brand||'')}"></div><div class="field"><label>Modelo</label><input id="m-model" value="${escapeHtml(b.model||'')}"></div></div><div class="grid three-col"><div class="field"><label>Ano</label><input id="m-year" type="number" value="${escapeHtml(b.year||'')}"></div><div class="field"><label>Cor</label><input id="m-color" value="${escapeHtml(b.color||'')}"></div><div class="field"><label>Quilometragem</label><input id="m-odo" type="number" value="${escapeHtml(b.odometer||'')}"></div></div><div class="field"><label>Consumo médio km/L</label><input id="m-consumption" type="number" step="0.1" value="${escapeHtml(b.consumption||'')}"></div></div><div class="form-actions"><button class="btn secondary" data-close-modal>Cancelar</button><button class="btn" data-save-bike>Salvar</button></div>`);document.querySelector('[data-save-bike]').onclick=()=>{const brand=document.getElementById('m-brand').value.trim(),model=document.getElementById('m-model').value.trim();if(!brand||!model){toast('Informe marca e modelo.');return}const item={id:id||uid(),brand,model,year:document.getElementById('m-year').value,color:document.getElementById('m-color').value.trim(),odometer:Number(document.getElementById('m-odo').value||0),consumption:Number(document.getElementById('m-consumption').value||0),photo:b.photo||''};if(id)state.motorcycles=state.motorcycles.map(x=>x.id===id?item:x);else state.motorcycles.push(item);save();closeModal();renderApp();toast('Motocicleta salva.')}}

    function showFuelModal(){if(!state.motorcycles.length){toast('Cadastre uma moto antes de registrar abastecimento.');return}openModal(`<div class="eyebrow" style="color:#ff9b50">Minha moto</div><h3>Registrar abastecimento</h3><p>Use quilometragem e litros para calcular médias válidas.</p><div class="form-grid"><div class="field"><label>Motocicleta</label><select id="fu-bike">${state.motorcycles.map(b=>`<option value="${b.id}">${escapeHtml(b.brand)} ${escapeHtml(b.model)}</option>`).join('')}</select></div><div class="grid two-col"><div class="field"><label>Data</label><input id="fu-date" type="date"></div><div class="field"><label>Quilometragem</label><input id="fu-odo" type="number"></div></div><div class="grid two-col"><div class="field"><label>Litros</label><input id="fu-liters" type="number" step="0.01"></div><div class="field"><label>Valor total</label><input id="fu-total" type="number" step="0.01"></div></div><div class="field"><label>Posto <span class="muted">(opcional)</span></label><input id="fu-station"></div></div><div class="form-actions"><button class="btn secondary" data-close-modal>Cancelar</button><button class="btn" data-save-fuel>Salvar</button></div>`);document.querySelector('[data-save-fuel]').onclick=()=>{const f={id:uid(),motorcycleId:document.getElementById('fu-bike').value,date:document.getElementById('fu-date').value,odometer:Number(document.getElementById('fu-odo').value||0),liters:Number(document.getElementById('fu-liters').value||0),total:Number(document.getElementById('fu-total').value||0),station:document.getElementById('fu-station').value.trim()};if(!(f.date&&f.odometer>0&&f.liters>0)){toast('Informe data, quilometragem e litros.');return}state.fuelings.push(f);const bike=state.motorcycles.find(b=>b.id===f.motorcycleId);if(bike&&f.odometer>Number(bike.odometer||0))bike.odometer=f.odometer;save();closeModal();renderApp();toast('Abastecimento registrado.')}}
    function showExpenseModal(){openModal(`<div class="eyebrow" style="color:#ff9b50">Financeiro</div><h3>Adicionar despesa</h3><p>Registre um custo real da sua moto ou viagem.</p><div class="form-grid"><div class="field"><label>Categoria</label><select id="ex-cat"><option>Combustível</option><option>Pedágio</option><option>Estacionamento</option><option>Alimentação</option><option>Hospedagem</option><option>Manutenção</option><option>Equipamentos</option><option>Outros</option></select></div><div class="field"><label>Detalhe</label><input id="ex-detail" placeholder="Ex.: Posto da Serra"></div><div class="grid two-col"><div class="field"><label>Data</label><input id="ex-date" type="date"></div><div class="field"><label>Valor</label><input id="ex-amount" type="number" step="0.01"></div></div><div class="field"><label>Observação <span class="muted">(opcional)</span></label><textarea id="ex-note"></textarea></div></div><div class="form-actions"><button class="btn secondary" data-close-modal>Cancelar</button><button class="btn" data-save-expense>Salvar</button></div>`);document.querySelector('[data-save-expense]').onclick=()=>{const e={id:uid(),category:document.getElementById('ex-cat').value,detail:document.getElementById('ex-detail').value.trim(),date:document.getElementById('ex-date').value,amount:Number(document.getElementById('ex-amount').value||0),note:document.getElementById('ex-note').value.trim()};if(!(e.detail&&e.date&&e.amount>0)){toast('Preencha detalhe, data e valor.');return}state.expenses.unshift(e);save();closeModal();renderApp();toast('Despesa adicionada.')}}

    function showEventModal(id){const e=state.events.find(x=>x.id===id)||{};openModal(`<div class="eyebrow" style="color:#ff9b50">Administração local</div><h3>${id?'Editar evento':'Cadastrar evento'}</h3><p>Use somente informações de uma fonte oficial. O backend deverá proteger este formulário por papel administrativo.</p><div class="form-grid"><div class="field"><label>Nome</label><input id="ev-name" value="${escapeHtml(e.name||'')}"></div><div class="grid two-col"><div class="field"><label>Data</label><input id="ev-date" type="date" value="${escapeHtml(e.date||'')}"></div><div class="field"><label>Horário</label><input id="ev-time" type="time" value="${escapeHtml(e.time||'')}"></div></div><div class="grid three-col"><div class="field"><label>Cidade</label><input id="ev-city" value="${escapeHtml(e.city||'')}"></div><div class="field"><label>Estado</label><input id="ev-state" value="${escapeHtml(e.state||'')}"></div><div class="field"><label>Endereço</label><input id="ev-address" value="${escapeHtml(e.address||'')}"></div></div><div class="field"><label>Descrição</label><textarea id="ev-description">${escapeHtml(e.description||'')}</textarea></div><div class="field"><label>Link oficial</label><input id="ev-url" type="url" value="${escapeHtml(e.officialUrl||'')}"></div></div><div class="form-actions"><button class="btn secondary" data-close-modal>Cancelar</button><button class="btn" data-save-event>Salvar evento</button></div>`);document.querySelector('[data-save-event]').onclick=()=>{const item={id:id||uid(),name:document.getElementById('ev-name').value.trim(),date:document.getElementById('ev-date').value,time:document.getElementById('ev-time').value,city:document.getElementById('ev-city').value.trim(),state:document.getElementById('ev-state').value.trim().toUpperCase(),address:document.getElementById('ev-address').value.trim(),description:document.getElementById('ev-description').value.trim(),officialUrl:document.getElementById('ev-url').value.trim()};if(!(item.nam     function showEventDetails(id){const e=state.events.find(x=>x.id===id);if(!e)return;openModal(`<div class="eyebrow" style="color:#ff9b50">Detalhes do evento</div><h3>${escapeHtml(e.name)}</h3><p>${safeDate(e.date)}${e.time?' · '+escapeHtml(e.time):''} · ${escapeHtml(e.city)} · ${escapeHtml(e.state)}</p><div class="empty"><strong>${escapeHtml(e.address||'Endereço não informado')}</strong><p>${escapeHtml(e.description||'Sem descrição cadastrada.')}</p>${e.officialUrl?`<a class="btn small" href="${escapeHtml(e.officialUrl)}" target="_blank" rel="noreferrer">Abrir link oficial ↗</a>`:''}</div><div class="form-actions"><button class="btn secondary" data-close-modal>Fechar</button><button class="btn" data-modal-fav="${e.id}">${state.favorites.includes(e.id)?'★ Favoritado':'☆ Favoritar'}</button></div>`);document.querySelector('[data-modal-fav]')?.addEventListener('click',()=>{toggleFavorite(id);closeModal()})}

    const API_BASE='/api';
    async function api(path,options={}){const response=await fetch(API_BASE+path,{credentials:'include',headers:{'content-type':'application/json',...(options.headers||{})},...options});let payload={};try{payload=await response.json()}catch{}if(!response.ok){throw new Error(payload.error||'Não foi possível concluir a operação.')}return payload}

    function renderAuth(){const registering=authMode==='register';document.getElementById('root').innerHTML=`<main class="auth-shell"><section class="auth-card"><div class="auth-logo">${logo()}</div><span class="badge">APLICATIVO DOS MOTOCICLISTAS</span><h1 class="auth-title" style="margin-top:18px">${registering?'Crie seu perfil no Odisseia.':'Sua estrada começa aqui.'}</h1><p class="auth-copy">${registering?'Entre com sua conta segura e informe somente seu nome e a sua moto.':'Entre no Odisseia para acessar suas viagens, sua moto e suas ferramentas.'}</p><div class="auth-switch"><button class="${!registering?'active':''}" data-auth-mode="login">Entrar</button><button class="${registering?'active':''}" data-auth-mode="register">Criar conta</button></div><div class="form-grid"><a class="btn" href="/signin-with-chatgpt?return_to=%2F" target="_top">${registering?'Entrar para criar meu perfil':'Entrar com conta segura'}</a>${authError?`<p class="auth-error">${escapeHtml(authError)}</p>`:''}</div><div class="auth-note"><span class="badge">SEGURO</span><span>A autenticação é feita pelo acesso seguro do Odisseia. O cadastro da moto só aparece depois que a sessão for confirmada.</span></div><div class="auth-footer">Odisseia · dados individuais por motociclista</div></section></main>`;document.querySelectorAll('[data-auth-mode]').forEach(button=>button.addEventListener('click',()=>{authMode=button.dataset.authMode;authError='';renderAuth()}))}

    function ensureProfileMotorcycle(){
      const model=String(state.profile.motorcycleName||'').trim();
      if(!model)return false;
      if(!Array.isArray(state.motorcycles))state.motorcycles=[];
      const profileBike=state.motorcycles.find(b=>b.fromProfile);
      if(profileBike){
        if(profileBike.model!==model){profileBike.model=model;save()}
        return true
      }
      if(state.motorcycles.length)return true;
      state.motorcycles=[{id:'profile-motorcycle',brand:'',model,year:'',color:'',odometer:0,consumption:0,photo:'',fromProfile:true}];
      save();
      return true
    }

      const filtered=state.events.filter(e=>{const hay=[e.name,e.city,e.state,e.address,e.description].filter(Boolean).join(' ').toLowerCase();return (!query||hay.includes(query))&&(!uf||e.state===uf)&&(!date||e.date===date)});
      const states=['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO'];
      document.getElementById('events').innerHTML=`<div class="hero"><div><div class="eyebrow">Radar de encontros</div><h2>Encontre eventos<br><span style="color:var(--orange)">reais perto de você.</span></h2><p>Digite sua localização e abra uma busca atualizada na web ou no Google Maps. O usuário não cadastra eventos nesta tela.</p></div><button class="btn secondary" data-action="toggle-alerts">${state.preferences.eventAlerts?'✓ Alertas ativos':'Ativar alertas'}</button></div><article class="card"><div class="card-head"><div><h3>Buscar eventos reais</h3><p>Pesquise encontros de motociclistas por local, estado e data.</p></div><span class="badge">BUSCA EXTERNA</span></div><div class="form-grid"><div class="field"><label for="event-location">Cidade ou região</label><input id="event-location" value="${escapeHtml(location)}" placeholder="Ex.: Petrópolis, RJ"></div><div class="grid two-col"><div class="field"><label for="event-state">Estado</label><select id="event-state"><option value="">Todos os estados</option>${states.map(s=>`<option value="${s}" ${uf===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="event-date">Data</label><input id="event-date" type="date" value="${escapeHtml(date)}"></div></div><div class="grid two-col"><button class="btn" data-action="search-real-events">🔎 Buscar eventos reais</button><button class="btn secondary" data-action="search-real-events-map">📍 Abrir no Google Maps</button></div><div class="field"><label for="event-search">Filtrar eventos já recebidos pelo Odisseia <span class="muted">(opcional)</span></label><input id="event-search" value="${escapeHtml(search)}" placeholder="Nome do evento ou cidade"></div><button class="btn ghost" data-action="filter-local-events">Filtrar agenda interna →</button></div></article><div class="grid two-col" style="margin-top:16px"><article class="card">${cardHead('Mapa de encontros','Busca real por localização')}${empty('Abra o mapa para ver eventos próximos','O Odisseia não inventa marcadores: o Google Maps exibirá os locais e eventos encontrados agora.','<button class="btn small" data-action="search-real-events-map">Abrir busca no mapa</button>','📍',true)}</article><article class="card">${cardHead('Agenda interna','Eventos que já foram recebidos pelo Odisseia',state.events.length?`<span class="pill">${filtered.length} encontrado${filtered.length===1?'':'s'}</span>`:'')}${filtered.length?`<div class="event-list" id="event-list">${filtered.map(eventRow).join('')}</div>`:empty('Nenhum evento recebido ainda','Use a busca real acima para encontrar encontros atuais. A agenda interna só mostra registros fornecidos ao sistema.','','◉',true)}</article></div>`;
      document.querySelector('[data-action="search-real-events"]').addEventListener('click',()=>openRealEventsSearch('web'));
      document.querySelector('[data-action="search-real-events-map"]').addEventListener('click',()=>openRealEventsSearch('map'));
      document.querySelector('[data-action="filter-local-events"]').addEventListener('click',()=>{window.eventFilters={search:document.getElementById('event-search').value.trim(),location:document.getElementById('event-location').value.trim(),state:document.getElementById('event-state').value,date:document.getElementById('event-date').value};eventsView();bindApp()});
      ['event-location','event-search','event-date'].forEach(id=>document.getElementById(id)?.addEventListener('keydown',event=>{if(event.key==='Enter')openRealEventsSearch('web')}));
    }
    bootAuth();
  </script>
</body>
</html>
